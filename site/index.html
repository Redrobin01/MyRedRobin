/* Red Robin studio skin: warm paper, deep ink bar, robin-breast red used sparingly for the brand mark, active tab and primary actions.
   Layout: frozen ink header + tab strip, then one working view of tables and pop-outs. */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#2a2622; --muted:#6e675d; --line:#e3ded5;
  --accent:#b9481f; --accent-ink:#ffffff; --accent-soft:#f8e7dd;
  --bar:#050505; --bar-ink:#ece6dc; --bar-muted:#a19a8d; --bar-line:#2c2a27;
  --hover:#f9f6f1; --sel:#f6ece4;
  --s1:#b9481f; --s2:#1f6fa8;
  --good:#2f7a4f; --good-soft:#e5f2ea; --warn:#9a5d0c; --warn-soft:#fbefda; --bad:#b0302a; --bad-soft:#fae3e0;
  --info:#3d5b78; --info-soft:#e8eef4;
  --display:Georgia, "Iowan Old Style", "Palatino Linotype", serif;
  --body:"Open Sans", "Segoe UI", system-ui, sans-serif;
  --r:12px;
  color-scheme: light;
}
/* Day colours only (Chris, 21-Nov-2026): no night/dark mode, whatever the phone or computer is set to. */
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.005em}
h1{font-size:1.25rem}
h2{font-size:1.45rem}
h3{font-size:1.08rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.88rem}

header.top{background:var(--bar);color:var(--bar-ink);padding:7px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header.top .btn{background:transparent;color:var(--bar-ink);border-color:var(--bar-line)}
header.top .btn:hover{border-color:var(--bar-muted)}
header.top select{background:transparent;color:var(--bar-ink);border-color:var(--bar-line)}
header.top select option{color:#27211e;background:#fff}
header.top .termsel label{color:var(--bar-muted)}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 auto;min-width:0}
.brand .logo{flex:none;border-radius:50%;display:block;box-shadow:0 0 0 1px var(--bar-line)}
.brand .wm{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:14px;row-gap:2px;line-height:1.1}
.brand .wm b{font:400 1.35rem/1 var(--display);letter-spacing:.02em}
.brand .wm span{font:italic 400 .9rem/1.2 var(--display);letter-spacing:.01em;color:var(--bar-muted)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none}
.testbadge{margin-left:auto;margin-right:6px;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--bar-line);color:var(--bar-muted);padding:2px 8px;border-radius:999px;align-self:center}
.termsel{display:flex;gap:8px;align-items:center}
select,input[type=text],input[type=number],input[type=search],input[type=email],input[type=tel],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
/* Title bar and tabs stay put while the page scrolls */
#tydetail{scroll-margin-top:110px}
.stickybar{position:sticky;top:0;z-index:15;box-shadow:0 6px 18px rgba(40,28,22,.06)}
nav.tabs{display:flex;gap:2px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs a{padding:12px 14px 10px;text-decoration:none;color:var(--muted);font-weight:600;letter-spacing:.01em;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main.wide{max-width:1480px}
main.wide table.reg{font-size:.92rem;line-height:1.4}
main.wide table.reg th,main.wide table.reg td{padding:9px 11px}
main.wide table.reg th{font-size:.72rem}
main.wide table.reg tfoot th{font-size:.92rem}
main.wide table.reg td.clip{max-width:260px}
main.wide table.reg td.notes{min-width:220px;max-width:340px}
main.wide table.reg td.nm{min-width:180px}
main{max-width:1200px;margin:0 auto;padding:24px 20px 64px;display:flex;flex-direction:column;gap:20px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:4px 9px;font-size:.88rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.busy{cursor:progress}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);cursor:pointer;font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:var(--accent)}
.nsdoneblock{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px} .nsdone{margin:6px 0 0;padding-left:18px} .nsdone li{margin:2px 0}
.fullycol{width:64px;white-space:nowrap} .fullycol input{width:18px;height:18px;accent-color:var(--good);cursor:pointer} .fullycol input:disabled{cursor:default}
.fullycol .fs{display:none} .fullyauto{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;background:var(--good);color:#fff;font-size:13px;font-weight:700;line-height:1;vertical-align:middle}
@media (max-width:600px){ .fullycol{width:30px;padding-left:2px!important;padding-right:2px!important} .fullycol .fl{display:none} .fullycol .fs{display:inline} }
.tpltokens{display:flex;gap:6px;flex-wrap:wrap} .tplbody{width:100%;font:inherit;line-height:1.45;resize:vertical} .tplprev pre{white-space:pre-wrap;font:inherit;margin:6px 0 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.gcline{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 6px;font-size:.88rem;line-height:1.45} .gcform{display:flex;flex-direction:column;gap:10px;margin-top:10px} .gcform input{width:100%}
.famsel{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted)} .famsel select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)} .famsel.on{color:var(--accent);font-weight:600} .famsel.on select{border-color:var(--accent);color:var(--accent);font-weight:600}
.placebtns{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.wlmv{display:flex;flex-direction:column;gap:8px;margin-top:4px}.wlmv .wlmvrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:6px 10px}.wlmv .wlmvrow b{flex:1 1 120px}.wlmv select{flex:1 1 220px;max-width:100%}
.placebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;background:var(--accent-soft,#fdf1ef);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:4px 0 12px}

.banner{border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.banner.err{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.info{background:var(--info-soft);border-color:transparent}
.banner.good{background:var(--good-soft);border-color:transparent}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;border-top:3px solid var(--accent)}
.tile .k{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font:400 1.7rem/1.2 var(--display);font-variant-numeric:tabular-nums lining-nums;margin-top:4px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--muted)}
.card .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--good)}
@media (prefers-reduced-motion: no-preference){ .btn,.linkbtn{transition:all .15s} }
@media (max-width:520px){ .brand .wm span{display:none} header.top{padding:10px 16px} nav.tabs{padding:0 12px} main{padding:18px 16px 48px} }

.pill{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.med{background:var(--accent-soft);color:var(--accent)}
.pill.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.section{box-shadow:0 1px 2px rgba(40,28,22,.04)}
.section>.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(160px,1.2fr) minmax(170px,1fr) auto;gap:10px 16px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.item:last-child{border-bottom:0}
.item.flag{box-shadow:inset 4px 0 0 var(--accent)}
.item.left{opacity:.6}
.item .name{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.medtext{background:var(--accent-soft);border-radius:8px;padding:6px 8px;font-size:.92rem}
.medtext b{color:var(--accent)}
.money{text-align:right}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){
  .item{grid-template-columns:1fr;}
  .money,.actions{text-align:left;justify-content:flex-start}
}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.74rem;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
thead th{background:var(--surface)}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
/* Frozen column headings: the table scrolls with the page, so its headings stick just under the frozen top bar */
.tablewrap.sticky{overflow:visible}
.section.stickysec{overflow:visible}
.section.stickysec thead tr:first-child th:first-child{border-top-left-radius:var(--r)}
.section.stickysec thead tr:first-child th:last-child{border-top-right-radius:var(--r)}
table.classtbl td{padding:5px 10px;vertical-align:middle}
table.classtbl .wlgo{padding:2px 9px}
table.week.sticky{font-size:.9rem}
table.week.sticky th,table.week.sticky td{padding:7px 8px}
table.week.sticky td:nth-child(4){min-width:180px}
table.week.sticky th{white-space:nowrap}
/* a page's own heading row can freeze too, with the table headings sitting just under it */
.regpagehead{display:flex;flex-direction:column;gap:10px}
.histbtn{display:inline-flex;align-items:center;justify-content:center;padding:6px 9px}
.histlist{display:flex;flex-direction:column;max-height:60vh;overflow:auto;margin:0 -4px;padding:0 4px}
.histrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.histrow:last-child{border-bottom:0}.histrow.undone{opacity:.6}
.toast{display:flex;align-items:center;gap:12px;max-width:calc(100vw - 24px)}
.wlgo{white-space:nowrap}
@media (max-width:600px){ .pagehead.wlstick > .rowgap{flex-wrap:nowrap} .pagehead.wlstick h2 > .muted{display:none} .phx{display:none} .wltools > .rowgap{flex-wrap:nowrap;gap:8px} .wltools .wlq-in{flex:1 1 auto !important;min-width:0;max-width:none !important;width:auto} .wltools .rowgap > span[style]{display:none} .wltools .btn{flex:none} }.wlph{display:none}
@media (max-width:600px){ .wlcol{display:none} .wlph{display:table-cell} .clstiles{display:none} table.classtbl .morebtn{min-width:28px;height:28px} table.classtbl td,table.classtbl th{padding:5px 5px} table.classtbl th{font-size:.68rem;letter-spacing:.02em} table.classtbl .pill{font-size:.7rem;padding:2px 6px} table.classtbl tr > :first-child{display:none} table.classtbl tr > :nth-child(2){padding-left:12px} table.classtbl .wlph{padding-right:10px} .wlnum.zero{color:var(--muted)} }
.wlgo.none{color:var(--muted)}
.pagehead{position:sticky;top:var(--stick,100px);z-index:6;background:var(--bg);padding:10px 0;margin:-10px 0}
table.sticky thead th{position:sticky;top:var(--stick2,var(--stick,100px));z-index:5;background:var(--surface);box-shadow:0 1px 0 var(--line)}
table.week tr.upcoming td:first-child{box-shadow:inset 3px 0 0 var(--info)}
@media (max-width:900px){ .tablewrap.sticky{overflow-x:auto} table.sticky thead th{position:static} .pagehead{position:static;margin:0;padding:0} }
.wltools{position:sticky;top:var(--stick3,100px);z-index:6;background:var(--bg);padding:0 0 10px;display:flex;flex-direction:column;gap:10px}
.pagehead.wlstick{padding-bottom:10px;margin-bottom:0}
.pagehead.wlstick + .wltools{margin-top:-16px}
@media (max-width:900px){ .pagehead.wlstick{position:-webkit-sticky;position:sticky;z-index:12;padding:8px 0;margin:-8px 0 0;box-shadow:0 1px 0 var(--line);-webkit-transform:translateZ(0);transform:translateZ(0)} .wltools{position:relative;top:auto;z-index:1;padding:0} .pagehead.wlstick + .wltools{margin-top:0}
  .wlsec .tablewrap.sticky{overflow-x:visible} .wlsec table.sticky thead th{position:sticky;top:var(--stick2,100px)} }

tfoot th{border-top:1px solid var(--ink);border-bottom:0;color:var(--ink);font-weight:700;font-size:.9rem;letter-spacing:0;text-transform:none}
td.c,th.c{text-align:center}
.nowrap{white-space:nowrap}
.mtph,.mtcatph{display:none}
.mtnbtn{background:none;border:0;padding:0;font:inherit;text-align:left;cursor:pointer;color:var(--ink);font-size:.86rem}
.mtnbtn .nt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-style:italic;border-left:2px solid var(--accent);padding-left:7px;overflow-wrap:anywhere}
.mtnbtn.empty{color:var(--muted);font-weight:600;font-size:.78rem;opacity:.8}
.mtnbtn.empty:hover{opacity:1;color:var(--accent)}
td.mtnote{min-width:150px;max-width:260px}
.mtcnrow{font-size:.8rem;line-height:1.35;margin:1px 0} .mtcnwho{font-weight:600;color:var(--ink)}
.mtcn{color:var(--muted)} .mtcnro .mtcn{opacity:.75;font-style:italic}

.mtnoteph{display:none}

/* Students: search + filters and column headings stay put while scrolling */
.sthead .field{margin:0}
.stclsph{display:none;font-weight:400}
.mtcount{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:.75rem;font-weight:700;line-height:18px;text-align:center} .mtcount.zero{background:var(--line);color:var(--muted)}
@media (max-width:600px){ table.mettletbl td, table.mettletbl th{padding-left:4px !important;padding-right:4px !important} table.mettletbl td.nm{min-width:0 !important;max-width:118px} table.mettletbl .mtmatch{max-width:100px} .mtsel input{width:17px;height:17px} }

.mtstats{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline} .mtstats b{color:var(--ink);font-weight:600}

.mtlist{display:flex;flex-direction:column;gap:4px}

.mtrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:400}
.mtrow:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:600px){ .mtcards{grid-template-columns:repeat(3,1fr);gap:6px} .mtcards .card{padding:8px;gap:2px} .mtcards .card .num{font-size:1rem !important} .mtcards .card > .small:last-child{display:none} .mtmatch{min-width:0;max-width:120px} table.mettletbl .mtmatch .muted{display:none} }
@media (max-width:600px){ table.studtbl .stx{display:none} table.studtbl td.nm{min-width:0} .sthead label, .sthead .field > span.small{display:none} .pagehead.wlstick.sthead > .rowgap{flex-wrap:wrap;gap:6px} .sthead .field:first-child{flex:1 1 100% !important} table.studtbl .stclsph{display:block} .sthead .seg{padding:5px 9px} }
@media (max-width:600px){ table.mettletbl .mtcat{display:none} table.mettletbl .mtph{display:inline} table.mettletbl .mtcatph{display:block} table.mettletbl td.nm{min-width:0} }
table.week tbody tr.clickrow{cursor:pointer}

<body class="parentmode">
<main id="main"></main>
<div id="modal"></div>
<script>
const CONFIG = {"api": "https://script.google.com/macros/s/AKfycbwWruMZQLLSaN1fFWjAN5NN-YXZSFIfdl3qM4ykaevZYo2K5FrfEKEnfYzZbyKBJejx/exec", "version": "0.12.01", "demo": false};
</script>
<script>

/* ---------- Portal tab – PROTOTYPE (Chris, 24-Nov-2026) ----------
   What a family would see in a self-service swaps portal: log in -> select child -> that child's classes.
   Log in by typing the email address on the registration form (Chris, 24-Nov 22:05); you then see every student
   registered with that email (Parent 1 / Parent 2 email for children, Email for adults) – usually one child,
   several for families. Test families have made-up emails (test1@redrobin.test …).
   classes, class dates (Sessions tab), places and existing swaps (Swaps tab), but every swap made here is
   kept in memory only: nothing is written to the sheet. "Reset demo" starts again from the sheet.
   Rules (Chris, 24-Nov): max 16 in a children's class, 14 in an
   adult class (unless the class's Capacity is set); a child can swap into any other children's class (the
   "no longer than their own" rule was dropped 24-Nov 11:34; adults: adult classes); swap right up to the start (25-Nov); make-up in any
   term within a year of the missed class; 2 swaps per term per student; "owed" = unbook a class now, book the make-up later (for a year); cancel up
   to the deadline. Absent-this-term students don't count towards the max. */
const PT_DAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const PT_MAX = {Children:16, Adults:15}, PT_LIMIT = Infinity, PT_NOTICE_H = 0; /* Chris 25-Nov: swap right up to the start; adults 15; NO limit on swaps per term (09:59) – only the class maximums matter */
let PT = null;
window.__portal = ()=>PT; /* for testing */
function ptTerm(){ return (S.settings && S.settings.CurrentTerm) || S.term; }
function ptGrp(c){ return isAdultClass(c) ? "Adults" : "Children"; }
function ptMins(c){ /* class length: adults 2h15, the £32-a-week children's class (Sun 3pm) 2h, the rest 1h30. Fee is per term, so divide by Weeks */
  if(isAdultClass(c)) return 135; const f = num(c.Fee), w = num(c.Weeks), rate = w>0 && f>60 ? f/w : f; return rate >= 30 ? 120 : 90; }
function ptMax(c){ return capOf(c.ClassID) || PT_MAX[ptGrp(c)]; }
function ptHm(c){ const m = String(c.Time||"").match(/(\d{1,2})(?:[.:](\d{2}))?\s*(am|pm)/i); if(!m) return [0,0]; let h = +m[1]%12; if(/pm/i.test(m[3])) h += 12; return [h, +(m[2]||0)]; }
function ptTime(c){ return String(c.Time||"").trim(); }
function ptDt(cid, iso){ const c = classById(cid), d = isoDate(iso), hm = ptHm(c); d.setHours(hm[0], hm[1], 0, 0); return d.getTime(); }
function ptD(iso, yr){ const d = isoDate(iso); return d ? `${PT_DAY[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}-${MON[d.getMonth()]}${yr?"-"+d.getFullYear():""}` : iso; }
function ptWhen(cid, iso){ return `${ptD(iso)} · ${ptTime(classById(cid))}`; }
function ptLen(c){ const m = ptMins(c), h = Math.floor(m/60), q = {0:"",15:"¼",30:"½",45:"¾"}[m%60]; return q===undefined ? `${m} mins` : `${h}${q} hr${m>60?"s":""}`; } /* "1½ hrs", "2 hrs", "2¼ hrs" */
function ptLenH(cid){ const c = classById(cid); return c ? ` <span class="ptlen">(${esc(ptLen(c))})</span>` : ""; }
function ptWhenH(cid, iso){ return esc(ptWhen(cid, iso)) + ptLenH(cid); } /* day, date and time, with the class length in brackets in smaller type */
function ptLblH(cid){ return esc(classLabel(classById(cid))) + ptLenH(cid); }
function ptOpen(cid, iso){ return ptDt(cid, iso) - Date.now() > PT_NOTICE_H*3600e3; } /* class not started yet? */
function ptHash(s){ let h = 7; for(const ch of s) h = (h*31 + ch.charCodeAt(0))>>>0; return h; }
function ptFirst(name){ return String(name||"").replace(/\([^)]*\)/g, " ").trim().split(/\s+/)[0] || String(name||""); }
function ptSurname(name){ const p = String(name||"").replace(/\([^)]*\)/g, " ").trim().split(/\s+/); return p[p.length-1] || String(name||""); }

/* every term class, its dates and the people in it (left and absent-this-term places don't count) */
function ptClasses(){ return S.classes.filter(c=>c.Term===ptTerm() && !isWorkshop(c)); }
function ptNoSwapTo(c){ /* the children's Sunday 3pm class is the GCSE class: never offered as a swap (Chris, 25-Nov 19:57) */
  return !/^adult/i.test(String(c.Group||"")) && /^sun/i.test(String(c.Day||"")) && /^(3([.:]00)?\s*pm|15[.:]00)$/i.test(String(c.Time||"").trim()); }
function ptAnyClasses(){ return S.classes.filter(c=>!isWorkshop(c) && !ptNoSwapTo(c)); } /* make-ups can be in any term (Chris, 25-Nov 09:15) */
function ptYear(iso){ const d = isoDate(iso); if(!d) return ""; d.setFullYear(d.getFullYear()+1); return toIso(d); } /* a make-up lasts a year from the missed class */
function ptToday(){ return toIso(new Date()); }
function ptActiveTerms(kid){ /* terms this student is in a class (not Left/Absent): a swap can only go into one of those (Chris, 25-Nov 09:33) */
  if(kid.terms) return new Set(kid.terms);
  if(/^T/.test(kid.ref)) return new Set([ptTerm()]);
  return new Set(S.enrol.filter(e=>String(e.Ref)===String(kid.ref) && !/^(left|absent)/i.test(e.Status||"") && classById(e.ClassID) && !isWorkshop(classById(e.ClassID))).map(e=>e.Term));
}
function ptSessions(cid){ return sessAll().filter(s=>s.ClassID===cid && s.day && !/^cancel/i.test(s.Status)).map(s=>s.day).sort(); }
function ptBase(cid){ return classRoster(cid).filter(v=>!v.left && !v.absent).length; }
function ptCount(cid, iso){ let n = ptBase(cid);
  PT.swaps.forEach(w=>{ if(w.status==="booked" && w.to===cid && w.td===iso) n++; if(w.from===cid && w.fd===iso && !/^T/.test(w.sid)) n--; }); return n; } /* test students aren't in the class numbers, so their swaps out don't free a place */
function ptFamilies(){ /* families in the current term: brothers and sisters share a phone number / parent; adults are on their own */
  const fams = new Map();
  ptClasses().forEach(c=>classRoster(c.ClassID).filter(v=>!v.left && !v.absent && v.st).forEach(v=>{
    const key = familyKey(v.st, v.e); let f = fams.get(key);
    if(!f){ f = {key, adult:isAdult(v.st), parent:v.st.p1||"", kids:new Map()}; fams.set(key, f); }
    let k = f.kids.get(v.st.ref); if(!k){ k = {ref:String(v.st.ref), name:v.name, adult:isAdult(v.st), enr:[]}; f.kids.set(v.st.ref, k); }
    k.enr.push({eid:v.e.EnrolmentID, cid:c.ClassID});
  }));
  const all = [...fams.values()].map(f=>Object.assign(f, {kids:[...f.kids.values()].sort((a,b)=>a.name.localeCompare(b.name))}));
  all.forEach(f=>{ f.label = f.adult ? f.kids[0].name : `${ptSurname(f.kids[0].name)} family`; });
  return all;
}
function ptTestFams(){ /* 3 made-up families placed in real classes, for trying things out (they don't change class sizes) */
  const cs = ptClasses().slice().sort((a,b)=>num(a.Sort)-num(b.Sort)), kidsC = cs.filter(c=>!isAdultClass(c)), adC = cs.filter(isAdultClass);
  const short = kidsC.filter(c=>ptMins(c)===90), long = kidsC.find(c=>ptMins(c)>90) || kidsC[kidsC.length-1];
  const at = (arr, i) => arr.length ? arr[i % arr.length] : null;
  const fam = (n, code, label, adult, kids) => ({key:"test|"+n, code, label, adult, test:true, email:`test${n===4?3:n===3?4:n}@redrobin.test`,
    kids: kids.filter(k=>k[1]).map((k,i)=>({ref:`T${n}${i}`, name:k[0], adult, enr:[{eid:`TE${n}${i}`, cid:k[1].ClassID}]}))});
  return [ fam(1, "TST222", "Test family 1", false, [["Alfie Test", at(short,0)], ["Bella Test", long]]),
           fam(2, "TST333", "Test family 2", false, [["Cara Test", at(short,2)]]),
           fam(4, "TST444", "Test family 3", false, [["Eddie Test", at(short,1)], ["Flora Test", at(short,3)], ["George Test", at(short,4)]]),
           fam(3, "TST555", "Dan Test", true, [["Dan Test", at(adC,0)]]) ].filter(f=>f.kids.length);
}
function ptInit(){
  const term = ptTerm(), eids = new Map(), today = ptToday();
  S.enrol.forEach(e=>eids.set(e.EnrolmentID, e));
  /* this term's swaps, plus older ones still open: an owed swap lasts a year, a booked make-up until it happens (Chris, 25-Nov 09:15) */
  const keep = r=>{ const e = eids.get(r.EnrolmentID), booked = /^booked/i.test(r.Status), owed = /^owed/i.test(r.Status);
    if(!e || !classById(r.FromClass) || !(booked||owed) || (booked && !classById(r.ToClass))) return false;
    return e.Term===term || (booked && r.td && r.td>=today); }; /* banked swaps last one term (26-Nov) */
  PT = { fam:null, sid:null, all:{}, seq:1, _more:false, _q:"", _pick:null, _err:"",
    swaps: swapsAll().filter(keep)
      .map(r=>({id:"R"+r.SwapID, eid:r.EnrolmentID, sid:String(eids.get(r.EnrolmentID).Ref), from:r.FromClass, fd:r.fd||"", to:/^booked/i.test(r.Status)?r.ToClass:"", td:/^booked/i.test(r.Status)?r.td:"", status:/^booked/i.test(r.Status)?"booked":"owed", real:true, cur:eids.get(r.EnrolmentID).Term===term})) };
  PT.fams = ptFamilies().concat(ptTestFams()); /* every family this term, plus the test families */
}
function ptFam(){ return PT.fams.find(f=>f.key===PT.fam); }
function ptKid(sid){ const f = ptFam(); return f && f.kids.find(k=>k.ref===sid); }
function ptUsed(sid){ return PT.swaps.filter(w=>w.sid===sid && w.cur!==false).length; } /* 2 per term: older terms' swaps don't count */
function ptUsedHtml(sid){ return isFinite(PT_LIMIT) ? (u=>`<span class="ptused${u>=PT_LIMIT?" full":""}">${u>PT_LIMIT?`${u} swaps (limit ${PT_LIMIT})`:`${u} of ${PT_LIMIT} swaps used`}</span>`)(ptUsed(sid)) : ""; } /* nothing shown when there's no limit */
function ptOptions(kid, cid, skip){ /* classes this student could go to instead of a date in class cid */
  const own = classById(cid), mine = new Set(PT.swaps.filter(w=>w.sid===kid.ref && w.status==="booked").map(w=>w.to+"|"+w.td)), myCls = new Set(kid.enr.map(x=>x.cid));
  const until = ptTermEnd() || ptYear(ptMissedOf(cid, skip)) || ptYear(ptToday()); /* swaps last one term (Chris, 26-Nov 09:42) */
  const terms = ptActiveTerms(kid);
  return ptAnyClasses().filter(c=>ptGrp(c)===ptGrp(own) && !myCls.has(c.ClassID) && terms.has(c.Term) && String(c.Term)===String(own.Term)) /* any children's class in a term they're enrolled in; adults: adult classes */
    .flatMap(c=>ptSessions(c.ClassID).map(iso=>({cid:c.ClassID, iso, dt:ptDt(c.ClassID, iso)})))
    .filter(x=>x.iso<=until && ptOpen(x.cid, x.iso) && !mine.has(x.cid+"|"+x.iso) && skip!==x.cid+"|"+x.iso)
    .map(x=>({...x, spaces: ptMax(classById(x.cid)) - ptCount(x.cid, x.iso)})).sort((a,b)=>a.dt-b.dt);
}
function ptMissedOf(cid, skip){ return PT._missed || ""; } /* the missed date the picker is for (set when the picker opens) */
function ptTermEnd(){ const td = termDates(ptTerm()); return td && isoDate(td.End) ? toIso(isoDate(td.End)) : ""; }
function ptByWhen(){ const e = ptTermEnd(); return e ? ptD(e, true) : "the end of term"; }

/* ----- screens ----- */
function ptLogo(){ const img = document.querySelector("header .logo"); return img ? `<img src="${img.src}" alt="" width="56" height="56" class="ptlogo">` : ""; }
function ptTop(sub){ const f = PT.fam && ptFam();
  return `<div class="pttop">${PT.fam?`<div class="ptbrand" aria-label="Red Robin"></div><div class="ptwho"><span>${esc(f?f.label:"")}</span><span class="ptacts">${typeof APP!=="undefined" && APP.data && APP.data.pay ? `<button type="button" class="ptout ptpaid" data-pt="paid">Have I paid?</button>` : ""}<button type="button" class="ptout pttd" data-pt="termdates">Term dates</button><button type="button" class="ptout" data-pt="logout">Log out</button></span></div>`:""}</div>${PT.fam?`<button type="button" class="pthow" data-pt="rules"><span class="pthi">i</span>How it works<span class="pthc">›</span></button>`:""}`; } /* logo only in the bar; How it works on its own strip (Chris, 26-Nov 10:07) */
function ptEmailNorm(e){ return String(e||"").trim().toLowerCase(); }
function ptEmailOk(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(ptEmailNorm(e)); }
function ptStEmails(ref){ /* the emails on a student's registration form row */
  const st = S.byRef.get(String(ref)); if(!st) return [];
  return [st.emailAddr, st.emailAddr2, st.emailOld].map(ptEmailNorm).filter(Boolean);
}
function ptByEmail(email){ /* everyone this term registered with this email -> one "family" to log in as */
  const e = ptEmailNorm(email); if(!ptEmailOk(e)) return null;
  const kids = PT.fams.flatMap(f=>f.kids.filter(k=> f.test ? f.email===e : ptStEmails(k.ref).includes(e)));
  if(!kids.length) return null;
  const uniq = [...new Map(kids.map(k=>[k.ref, k])).values()].sort((a,b)=>a.name.localeCompare(b.name));
  const adult = uniq.every(k=>k.adult), test = /@redrobin\.test$/.test(e);
  const st0 = S.byRef.get(String(uniq[0].ref));
  const label = uniq.length===1 && adult ? uniq[0].name : test ? (PT.fams.find(f=>f.test && f.email===e)||{}).label : `${ptSurname(uniq[0].name)} family`;
  return {key:"email|"+e, email:e, adult, test, label: label || (st0 && st0.p1) || e, kids:uniq};
}
function ptLogin(){
  return `<div class="ptlogin">${ptLogo()}<h3>Red Robin Art Academy</h3><p class="small muted">Class Swaps And Term Dates</p>
    <label class="ptlbl" for="pt-q">Your email address</label>
    <p class="small muted ptlhint" style="text-align:left;margin:-4px 0 8px;align-self:stretch">The one you gave on the registration form</p>
    <div class="ptsearch"><input id="pt-q" class="ptsel" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="name@example.com" value="${esc(PT._q||"")}"></div>
    ${PT._err?`<p class="ptnone">${PT._err}</p>`:""}
    <button type="button" id="pt-go" class="btn primary ptbig" data-pt="login"${ptEmailOk(PT._q)?"":" disabled"}>Log in</button><button type="button" class="ptlink ptrlink" data-pt="rules">How it works</button></div>`;
}
function ptSearch(){ /* typing in the email box: just enable the button, so the box keeps focus */
  const inp = $("#pt-q"); if(!inp) return; PT._q = inp.value;
  const b = $("#pt-go"); if(b) b.disabled = !ptEmailOk(PT._q);
  if(PT._err){ PT._err = ""; const m = document.querySelector(".ptlogin .ptnone"); if(m) m.remove(); }
}

function ptTermDates(){ /* term dates from the TermDates tab (sent by the bridge, v8), laid out like Carla's term dates sheet */

  const add = (iso, n)=>{ const d = isoDate(iso); d.setDate(d.getDate()+n); return toIso(d); };
  const weeks = (a, b)=>{ const n = Math.round(((isoDate(b) - isoDate(a)) / 864e5 + 1) / 7); return ` <span class="tdw">(${n} week${n===1?"":"s"})</span>`; };
  const long = iso=>{ const d = isoDate(iso); const n = d.getDate(), th = (n%10===1&&n!==11)?"st":(n%10===2&&n!==12)?"nd":(n%10===3&&n!==13)?"rd":"th"; return `${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]} ${n}${th} ${["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()]}`; };
  const name = t=>{ const m = String(t.term).match(/(Autumn|Spring|Summer)/i); return m ? `${m[1]} Term ${isoDate(t.start).getFullYear()}` : t.term; };
  const row = (lbl, val)=>`<div class="tdrow"><span>${lbl}</span><b>${val}</b></div>`;
  const body = list.length ? list.map(t=>{ const rows = [];
      if(t.halfStart && t.halfEnd){
        const end1 = add(t.halfStart, -1), start2 = add(t.halfEnd, 1);
        rows.push(row("Block One", `${long(t.start)} – ${long(end1)}${weeks(t.start, end1)}`));
        (t.daysOff||[]).filter(d=>d<t.halfStart).forEach(d=>rows.push(row("Bank Holiday Closure", long(d))));
        rows.push(row("Half Term", `${long(t.halfStart)} – ${long(t.halfEnd)}`));
        rows.push(row("Block Two", `${long(start2)} – ${long(t.end)}${weeks(start2, t.end)}`));
        (t.daysOff||[]).filter(d=>d>t.halfEnd).forEach(d=>rows.push(row("Bank Holiday Closure", long(d))));
      } else { rows.push(row("Term", `${long(t.start)} – ${long(t.end)}`)); (t.daysOff||[]).forEach(d=>rows.push(row("Bank Holiday Closure", long(d)))); }
      return `<div class="tdterm"><h3>${esc(name(t))}</h3>${rows.join("")}</div>`; }).join("")

  ptDialog(`<h2>Term dates</h2>${body}<div class="ptfoot"><button type="button" class="btn" data-close>Close</button></div>`);
}

function ptDing(){ /* a soft two-note chime, made in the browser (no sound file); silently skipped if sound isn't allowed */
  try{ const A = window.AudioContext || window.webkitAudioContext; if(!A) return; const ac = ptDing.ac || (ptDing.ac = new A()); if(ac.state==="suspended") ac.resume();
    [[880,0],[1318.5,0.13]].forEach(([f,t])=>{ const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + t;
      o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0+0.9);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+0.95); });
  }catch(e){}
}

  if(k==="pick"){ const [ , mode, sid, own, ref, cid, iso] = p, kid = ptKid(sid), w = mode==="swap" ? null : PT.swaps.find(x=>x.id===ref);
    const from = mode==="swap" ? ptWhen(own, ref) : (w.fd ? ptWhen(w.from, w.fd) : "the missed class");
    ptConfirm(`<b>${esc(ptFirst(kid.name))}</b> will come to <b>${ptWhenH(cid, iso)}</b> instead of <b>${esc(from)}</b>.${mode==="swap" && isFinite(PT_LIMIT)?`<br><span class="small muted">This uses ${ptUsed(kid.ref)+1} of ${PT_LIMIT} swaps this term.</span>`:""}`,
      "Confirm swap", `do|${mode}|${sid}|${own}|${ref}|${cid}|${iso}`, mode==="swap" ? `swap|${sid}|${own}|${ref}` : `${mode}|${ref}`); return; }
  if(k==="do"){ const [ , mode, sid, own, ref, cid, iso] = p, kid = ptKid(sid);
    if(ptCount(cid, iso) >= ptMax(classById(cid)) || !ptOpen(cid, iso)){ toast("Sorry – that class is no longer available."); ptPicker(kid, mode, own, ref); return; }
    if(mode==="swap") PT.swaps.push({id:"D"+PT.seq++, sid, eid:(kid.enr.find(x=>x.cid===own)||{}).eid, from:own, fd:ref, to:cid, td:iso, status:"booked"});
    else Object.assign(PT.swaps.find(x=>x.id===ref), {to:cid, td:iso, status:"booked"});
    const w = mode==="swap" ? null : PT.swaps.find(x=>x.id===ref), fromH = mode==="swap" ? ptWhenH(own, ref) : (w && w.fd ? ptWhenH(w.from, w.fd) : "The missed class");
    closeAllDialogs(); render(); ptCelebrate(fromH, ptWhenH(cid, iso)); return; } /* Chris, 24-Nov 22:12: a fun "Swap confirmed" pop-up + ding, then back to the child's classes */
  if(k==="dolater"){ const kid = ptKid(p[1]); PT.swaps.push({id:"D"+PT.seq++, sid:kid.ref, eid:(kid.enr.find(x=>x.cid===p[2])||{}).eid, from:p[2], fd:p[3], to:"", td:"", status:"owed"});

  if(k==="undo"){ const w = PT.swaps.find(x=>x.id===p[1]), kid = ptKid(w.sid); ptConfirm(`Cancel this swap? <b>${esc(ptFirst(kid.name))}</b> will come to <b>${ptWhenH(w.from, w.fd)}</b> as usual.`, "Cancel swap", `doundo|${w.id}`, `manage|${w.id}`); return; }
  if(k==="doundo"){ const w = PT.swaps.find(x=>x.id===p[1]); PT.swaps = PT.swaps.filter(x=>x.id!==p[1]); closeAllDialogs(); render(); if(w) ptCancelPop(w); return; }
  if(k==="toowed"){ const w = PT.swaps.find(x=>x.id===p[1]); ptConfirm(`Cancel the class on <b>${ptWhenH(w.to, w.td)}</b>? It goes back to a banked swap you can book later this term.`, "Cancel class", `dotoowed|${w.id}`, `manage|${w.id}`); return; }

}

  if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return new Date(+m[1], +m[2]-1, +m[3]);

/* ----- the portal screens, fed from the bridge instead of the Rocker ----- */
function ptInit(){

function ptSessions(cid){ return ((APP.data && APP.data.sessions[cid]) || []).slice(); }

function ptCount(cid, iso){ /* places on that date: the sheet's count (all families' swaps included), with this family's changes made here */
  const base = ((APP.data && APP.data.counts[cid]) || {})[iso] || 0, test = APP.data && APP.data.family.test;

/* login screen: the Rocker's, plus the app's own messages, a loading state and the version */

const _ptClick = ptClick;

/* ----- saving swaps for real (25-Nov-2026, Chris: "make the link live") -----
   Every confirmed change goes to the bridge first; it checks everything again (space, dates, the family's own child)
   and writes the Swaps tab. Only when it says OK does the family see "Swap confirmed!". Test families stay a demo. */
const SAVES = {do:1, dolater:1, doundo:1, dotoowed:1};
function saving(){ return !CONFIG.demo && APP.data && !APP.data.family.test; }
async function saveChange(el, k, p){
  let req, done;
  if(k==="do"){ const [ , mode, sid, own, ref, cid, iso] = p, kid = ptKid(sid);
    if(mode==="swap"){ req = {op:"swap", eid:(kid.enr.find(x=>x.cid===own)||{}).eid, from:own, fd:ref, to:cid, td:iso}; }
    else req = {op:"book", id:ref, to:cid, td:iso};
    const w = mode==="swap" ? null : PT.swaps.find(x=>x.id===ref), fromH = mode==="swap" ? ptWhenH(own, ref) : (w && w.fd ? ptWhenH(w.from, w.fd) : "The missed class"), toH = ptWhenH(cid, iso);
    done = ()=>ptCelebrate(fromH, toH); }
  if(k==="dolater"){ const kid = ptKid(p[1]); req = {op:"later", eid:(kid.enr.find(x=>x.cid===p[2])||{}).eid, from:p[2], fd:p[3]}; done = ()=>toast(`Swap banked for ${ptFirst(kid.name)}.`); }
  if(k==="doundo"){ const w = Object.assign({}, PT.swaps.find(x=>x.id===p[1])); req = {op:"cancel", id:p[1]}; done = ()=>ptCancelPop(w); }
  if(k==="dotoowed"){ const w = Object.assign({}, PT.swaps.find(x=>x.id===p[1])); req = {op:"toowed", id:p[1]}; done = ()=>ptToOwedPop(w); }
  const btns = [...document.querySelectorAll("#modal button")], label = el.textContent;
  btns.forEach(b=>b.disabled = true); el.textContent = "Saving…";
  const undoBusy = ()=>{ btns.forEach(b=>b.disabled = false); el.textContent = label; };
  try{
    const r = await api(Object.assign({action:"change", code:APP.data.code}, req));
    if(r.ok){ closeAllDialogs(); refreshFrom(r.data); done(); return; }
    if(r.error==="badcode"){ closeAllDialogs(); forget(); APP.state = "out"; APP.msg = "Please log in again."; render(); return; }
    closeAllDialogs(); toast(r.error==="unknown" ? "Saving isn't switched on yet – nothing was saved. Please try again later." : (r.message || "Sorry – that couldn't be saved. Please try again."));
    refreshQuietly();
  }catch(e){ undoBusy(); toast("Couldn't connect – nothing was saved. Please check your internet and try again."); }
}
function refreshFrom(d){ if(!d || !d.ok) return; const sid = PT && PT.sid, all = PT && PT.all; useData(d); if(PT){ PT.sid = sid; PT.all = all || {}; } $("#main").innerHTML = viewPortal(); }
async function refreshQuietly(){ try{ const d = await api({action:"family", code:APP.data.code}); refreshFrom(d); }catch(e){} }
function rrClick(el){
  const k = el.dataset.rr;
  if(k==="install") installHelp();
  if(k==="noinstall"){ closeAllDialogs(); APP.ask = false; render(); window.scrollTo(0,0); }   /* this visit only – asks again next time */
  if(k==="helpdone"){ closeAllDialogs(); if(APP.ask){ APP.ask = false; render(); window.scrollTo(0,0); } }
  if(k==="doinstall" && APP.installEvt){ APP.installEvt.prompt(); APP.installEvt.userChoice.finally(()=>{ APP.installEvt = null; APP.ask = false; closeAllDialogs(); render(); }); }
  if(k==="retry"){ const c = APP.retry; APP.retry = null; APP.msg = ""; loadByCode(c); }
}

document.addEventListener("click", ev=>{
  const r = ev.target.closest("[data-rr]"); if(r){ ev.preventDefault(); rrClick(r); return; }
  const p = ev.target.closest("[data-pt]"); if(p){ ev.preventDefault(); ptClick(p); return; }
  if(ev.target.closest("[data-close]")){ ev.preventDefault(); closeDialog(); }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape") closeDialog(); });
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); APP.installEvt = e; });
window.addEventListener("appinstalled", ()=>{ APP.installEvt = null; APP.ask = false; closeAllDialogs(); render(); });
/* coming back to the app after a while: fetch fresh numbers (only when nothing is open) */
let hiddenAt = 0;
document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ hiddenAt = Date.now(); return; }
  if(APP.data && hiddenAt && Date.now()-hiddenAt > 20*60e3 && !$("#modal").children.length) loadByCode(APP.data.code); });
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});

(function start(){
  const u = new URL(location.href), code = (u.searchParams.get("c") || store.get() || "").trim();
  if(code) loadByCode(code); else { APP.state = "out"; render(); }
})();

/* Class picker: tag each date heading and its classes with the weekday, and show just the time on each class (26-Nov) */
(function(){
  if(typeof ptDialog!=="function") return;
  const orig = ptDialog;
  ptDialog = function(html){ orig(html); try{ document.querySelectorAll(".ptopts").forEach(box=>{ let dow = "";
    for(const el of box.children){ if(el.classList.contains("ptday")) dow = el.textContent.trim().slice(0,3); if(dow) el.dataset.dow = dow;
      /* the date is in the heading, so each class shows just its time (Chris, 26-Nov) */
      const t = el.querySelector(".ptot"), n = t && t.firstChild; if(n && n.nodeType===3) n.textContent = n.textContent.replace(/^.*·\s*/, ""); } }); }catch(e){} };
})();

</script>
